[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riskreg"
version = "0.1.0"
description = "Cyber risk register: 5x5 scoring, NIST CSF 2.0 and ISO 27001 control mapping, FAIR-style Monte Carlo loss simulation and treatment ROI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vaishnavi U" }]
dependencies = ["pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3"]

[project.scripts]
riskreg = "riskreg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
"src/riskreg/report.py" = ["E501"]  # CSS and HTML template text read better unwrapped
"src/riskreg/simulate.py" = ["S311"]  # Monte Carlo needs a fast seeded PRNG, not a cryptographic one
